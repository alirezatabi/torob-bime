services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: torob
      POSTGRES_PASSWORD: torob_demo
      POSTGRES_DB: torob_bime
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torob -d torob_bime"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
